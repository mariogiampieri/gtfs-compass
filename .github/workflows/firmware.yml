name: firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  host-tests:
    # Seconds: plain cc + Unity over the platform-free model component.
    # Linux deliberately: Apple clang's ASan silently skips leak detection
    # (verified in review), Linux ASan includes LeakSanitizer by default.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run model tests (ASAN+LSAN)
        run: |
          cd firmware/test/host
          cmake -B build -G "Unix Makefiles" .
          cmake --build build
          ASAN_OPTIONS=detect_leaks=1 ./build/test_model
          ASAN_OPTIONS=detect_leaks=1 ./build/test_nav
          ASAN_OPTIONS=detect_leaks=1 ./build/test_bike_layout

  device-build:
    # Minutes: full ESP-IDF compile in the pinned container (no hardware).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # device build uses managed components, not the sim submodule
      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware

  sim-build:
    # Compile-only: proves ui/ + model/ stay platform-free.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SDL2
        run: brew install sdl2
      - name: Build simulator
        run: |
          cd firmware/sim
          cmake -B build -G "Unix Makefiles" .
          cmake --build build
      - name: Run gesture tracker tests (headless, no window)
        run: ./firmware/sim/build/test_input
