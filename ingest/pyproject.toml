[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtfs-compass-ingest"
version = "0.1.0"
description = "Catalog and static-GTFS ingest for gtfs-compass (Mobility Database -> D1)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.scripts]
gtfs-compass-ingest = "gtfs_compass_ingest.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_compass_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
